name: CI Action

on: push


permissions:
  contents: read
  packages: write


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
        docker build -t hello:v1 .
          docker run -d -p 8000:8000 hello
          chmod u+x test.sh
          ./test.sh
      - run: |
          echo "${{secrets.GITHUB_TOKEN}}" | docker login -u aleksa-dobre --password-stdin
          docker push ghcr.io/aleksa-dobre/hello:v1
