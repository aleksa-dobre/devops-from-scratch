name: pipeline-v1

on: pull

permissions:
  contents: read 
  packages: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/workflows@v6
      - name: Test  
        run: |
          docker build -t hello .
          docker run -d- p 8000:8000
          chmod u+x test.sh 
          ./test.sh 

      
